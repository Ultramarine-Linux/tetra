[package]
name = "tetra"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A modular host agent for Ultramarine Server and cloud hosts"
repository = "https://github.com/Ultramarine-Linux/tetra"
homepage = "https://github.com/Ultramarine-Linux/tetra"
documentation = "https://developer.fyralabs.com/tetra"

[features]
default = [
    "apps",
    "files",
    "recipes",
    "selinux",
    "services",
    "quadlets",
    "reverse-proxy",
    "podman",
    "samba",
    "nfs",
    "users",
    "storage",
    "network",
]
apps = ["quadlets", "services"]
files = []
recipes = []
selinux = []
services = []
storage = []
samba = []
nfs = []
network = []
podman = []
quadlets = []
reverse-proxy = []
users = []
virtual-machines = []


[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
kameo = "0.22"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
socket2 = { version = "0.6", features = ["all"] }
tera = "2.0"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = "0.23"
rustls-pemfile = "2"
itertools = "0.15.0"
libc = "0.2"
preinterpret = "0.2.1"
phf = { version = "0.14.0", features = ["macros"] }
enum_dispatch = "0.3.13"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

disallowed-macros = "deny"
excessive-nesting = "warn"

arithmetic_side_effects = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
field_scoped_visibility_modifiers = "deny"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
infinite_loop = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
needless_raw_strings = "warn"
rc_buffer = "warn"
rc_mutex = "deny"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_outside_block = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unwrap_in_result = "warn"
missing_errors_doc = "allow"
needless_for_each = "allow"
