[package]
name = "tetra"
version = "0.2.3"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A modular host agent for Ultramarine Server and cloud hosts"
repository = "https://github.com/Ultramarine-Linux/tetra"
homepage = "https://github.com/Ultramarine-Linux/tetra"
documentation = "https://developer.fyralabs.com/tetra"

[features]
# `tetra::auth::testing`: fake PAM, accounts, sealer and host for tests.
testing = []
default = [
    "apps",
    "files",
    "recipes",
    "selinux",
    "services",
    "quadlets",
    "reverse-proxy",
    "podman",
    "samba",
    "nfs",
    "users",
    "storage",
    "network",
    "power",
    "updates",
    "remote-access",
]
apps = ["quadlets", "services"]
files = []
recipes = []
selinux = []
services = []
storage = []
samba = []
nfs = []
network = []
podman = []
power = []
updates = []
remote-access = []
quadlets = []
reverse-proxy = []
users = []
virtual-machines = []
# Development-only loopback TCP listener (`agent-ws-serve`). Release builds
# leave this off so the binary cannot listen on the network.
dev-listener = []


[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "3.0"
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots-no-provider",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
socket2 = { version = "0.6", features = ["all"] }
tera = "2.0"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = "0.23"
itertools = "0.15.0"
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# fd-relative file operations (`openat2` with `RESOLVE_BENEATH`) in
# directories the apps account owns (`agent::tree`).
rustix = { version = "1.1", features = ["fs"] }
x509-parser = "0.18.1"
# Login and authorization (`src/auth`). `pam-client` links the system libpam
# (bindgen, so it needs pam-devel and clang-devel to build); `webauthn-rs`
# links the system OpenSSL dynamically (openssl-devel).
chacha20poly1305 = "0.10"
nix = { version = "0.31", features = ["fs", "signal", "user"] }
pam-client = { version = "0.5", default-features = false }
sha2 = "0.11"
subtle = "2.6"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }

[dev-dependencies]
nix = { version = "0.31", features = ["term"] }
# Integration tests use the fakes in `tetra::auth::testing`.
tetra = { path = ".", default-features = false, features = ["testing"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tempfile = "3"
time = "0.3"
# The in-process mTLS controller fixture in `tests/remote_enrollment.rs`.
tokio-rustls = "0.26"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[lints]
workspace = true

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

disallowed_macros = "deny"
excessive_nesting = "warn"

arithmetic_side_effects = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
field_scoped_visibility_modifiers = "deny"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
infinite_loop = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
needless_raw_strings = "warn"
rc_buffer = "warn"
rc_mutex = "deny"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_outside_block = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unwrap_in_result = "warn"
missing_errors_doc = "allow"
needless_for_each = "allow"
