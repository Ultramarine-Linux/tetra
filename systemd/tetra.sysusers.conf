# Members of this group may connect to the local Tetra socket. Grant it to the
# dashboard and server OOBE accounts; it does not grant any host privileges
# by itself, as Tetra still identifies the client and authenticates every
# request.
#
# The GID is fixed at 241 because the dashboard runs in a rootful container
# and receives the group by number in its Quadlet (GroupAdd=241). 241 is in
# Fedora's system range (SYS_GID_MIN 201 to SYS_GID_MAX 999), outside the
# 0-200 range the setup package reserves for its static uidgid list, and far
# from the top of the range where dynamic system IDs are allocated.
#
# systemd-sysusers keeps an existing tetra group as it is, and falls back to a
# dynamic GID if 241 is already taken. tetra agent-serve logs a warning when
# the group's GID is not 241.
g tetra 241

# The account every user app runs under: rootless Quadlets in its home
# (~/.config/containers/systemd, companion files and manifests in
# ~/.local/share/tetra/quadlets) and services in its lingering user manager.
# Rootful Quadlets are kept for real system services. It cannot log in (no
# password, nologin shell), and Tetra refuses it as a dashboard user.
#
# UID and GID are fixed at 242, next to the tetra group and for the same
# reasons: Fedora's system range (201-999), outside the setup package's static
# 0-200, and far from the top where dynamic IDs are allocated. A fixed ID
# keeps file ownership in the home (and in backups of it) the same on every
# host. Plain `u`, not `u!`: a fully locked (expired) account would make
# pam_unix refuse the account's user@.service.
#
# systemd-sysusers only records the home; tetra.tmpfiles.conf creates it and
# the linger flag. Rootless Podman also needs subordinate UIDs and GIDs, which
# systemd-sysusers does not allocate: Tetra adds a free range with
# `usermod --add-subuids/--add-subgids` the first time it converges an app.
# tetra agent-serve logs a warning when the account's UID or GID is not 242.
g ultramarine-apps 242
u ultramarine-apps 242:242 "Ultramarine Server apps" /var/lib/ultramarine-apps
