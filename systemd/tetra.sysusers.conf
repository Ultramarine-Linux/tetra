# Members of this group may connect to the local Tetra socket. Grant it to the
# dashboard and server OOBE accounts; it does not grant any host privileges
# by itself, as Tetra still identifies the client and authenticates every
# request.
#
# The GID is fixed at 241 because the dashboard runs in a rootful container
# and receives the group by number in its Quadlet (GroupAdd=241). 241 is in
# Fedora's system range (SYS_GID_MIN 201 to SYS_GID_MAX 999), outside the
# 0-200 range the setup package reserves for its static uidgid list, and far
# from the top of the range where dynamic system IDs are allocated.
#
# systemd-sysusers keeps an existing tetra group as it is, and falls back to a
# dynamic GID if 241 is already taken. tetra agent-serve logs a warning when
# the group's GID is not 241.
g tetra 241
