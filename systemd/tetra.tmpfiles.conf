# The home of the apps account (tetra.sysusers.conf). Rootless Podman keeps
# its configuration and storage here, and Tetra the apps' Quadlets, companion
# files and manifests, all owned by the account.
d /var/lib/ultramarine-apps 0700 ultramarine-apps ultramarine-apps -
# Lingering: logind starts the account's user manager at boot, so app
# services run without anyone logging in (what `loginctl enable-linger`
# records).
d /var/lib/systemd/linger 0755 root root -
f /var/lib/systemd/linger/ultramarine-apps 0644 root root -
